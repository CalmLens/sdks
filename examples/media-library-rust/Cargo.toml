[package]
name = "calmlibrary"
version = "0.1.0"
edition = "2021"
publish = false
description = "A private team media library using the CalmLens Rust SDK"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
calmlens = { path = "../../rust" }
form_urlencoded = "1"
getrandom = "0.2"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6.7", features = ["limit", "timeout"] }
url = "2"

[dev-dependencies]
# The SDK's offline MockServerClient, for tests only. Production code never uses it.
calmlens = { path = "../../rust", features = ["testing"] }
futures-util = "0.3"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "test-util"] }
tower = { version = "0.5", features = ["util"] }
