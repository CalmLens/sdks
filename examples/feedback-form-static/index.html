<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calmform – send feedback</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      textarea,
      input[type="file"] {
        display: block;
        width: 100%;
        margin-top: 0.25rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.5rem 1rem;
      }
      #result {
        margin-top: 1.25rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Send feedback</h1>
    <p>Tell us what went wrong and attach a screenshot.</p>

    <form id="feedback-form">
      <label for="message">What happened?</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <label for="screenshot">Screenshot</label>
      <input id="screenshot" name="screenshot" type="file" accept="image/*" required />

      <button type="submit">Send feedback</button>
    </form>

    <p id="result" role="status" aria-live="polite"></p>

    <!-- Points @calmlens/sdk/app at the bundled repo build. See the README to use a published release. -->
    <script type="importmap">
      { "imports": { "@calmlens/sdk/app": "./sdk/calmlens.js" } }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
