name: SDK examples
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
# Test the SDK from this checkout so pull requests catch example breakage before a release.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ./python
      - run: python -m unittest discover -v
        working-directory: examples/link-board-python
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/voice-clips-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/calmlens-voice-clips .
  ruby-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/comment-thread-ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: examples/comment-thread-ruby
          bundler-cache: true
      - run: bundle exec ruby -W app_test.rb
  java-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and verify against the checkout SDK
        run: |
          sdk_version="$(mvn -q -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          mvn -B -q -f java/pom.xml install -DskipTests
          mvn -B -f examples/marketplace-listing-java/pom.xml verify "-Dcalmlens.sdk.version=$sdk_version"
  rust-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/media-library-rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
          --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd javascript build
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: examples/calmgram
      - run: bun run check && bun run build && bun run test
        working-directory: examples/calmgram
      - run: bun run sdk && bun run test
        working-directory: examples/feedback-form-static
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: examples/mobile-uploads-expo
      - run: |
          bun run check
          bun run test
          bunx --no-install expo export --platform ios --platform android
        working-directory: examples/mobile-uploads-expo
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: examples/ui-components
      - run: bun run check
        working-directory: examples/ui-components
      - run: bun run build
        working-directory: examples/ui-components

  widget-playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/widget-playground
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun run --cwd javascript build
        working-directory: .
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      # Every library tab against the mock API and CDN, in Chromium, Firefox and WebKit.
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: widget-playground-playwright
          path: examples/widget-playground/test-results

  php-laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/comment-board-laravel
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2.35"
          tools: composer:v2
          extensions: curl, mbstring, dom, xml, xmlwriter
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  php-chirp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/chirp-php
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2.35"
          tools: composer:v2
          extensions: curl, mbstring, dom, xml, xmlwriter, fileinfo, gd
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
