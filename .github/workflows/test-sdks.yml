name: SDK Tests
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/check-sdk-release-tag.test.mjs
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests -v
      - name: Type-check (mypy --strict)
        if: matrix.python == '3.14'
        working-directory: python
        run: python -m pip install mypy==2.4.0 && python -m mypy
      - run: python -m pip wheel --no-deps ./python --wheel-dir /tmp/calmlens-dist
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - 1.22.x
          - stable
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd javascript check
      - run: bun run --cwd javascript test
      - run: bun run --cwd javascript build
      - run: >
          node -e "const { CalmLensServerClient } =
          require('@calmlens/sdk/server'); new CalmLensServerClient({ apiKey:
          'k', projectId: 'p' })"

          node -e "const { CalmLensAppClient } = require('@calmlens/sdk/app');
          new CalmLensAppClient({ uploadPresetId: 'u' })"

          node --input-type=module -e "const { CalmLensServerClient } = await
          import('@calmlens/sdk/server'); new CalmLensServerClient({ apiKey:
          'k', projectId: 'p' })"

          node --input-type=module -e "const { CalmLensAppClient } = await
          import('@calmlens/sdk/app'); new CalmLensAppClient({ uploadPresetId:
          'u' })"
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - "17"
          - "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
        working-directory: java
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.88.0
          - stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component
          rustfmt --component clippy
      - run: cargo +${{ matrix.rust }} fmt --check
        working-directory: rust
      - run: cargo +${{ matrix.rust }} test --locked
        working-directory: rust
      - run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
        working-directory: rust
      - run: cargo +${{ matrix.rust }} clippy --locked --no-default-features -- -D
          warnings
        working-directory: rust
      - run: cargo +${{ matrix.rust }} clippy --locked --no-default-features --features
          blocking,rustls-native-roots -- -D warnings
        working-directory: rust
      - run: cargo +${{ matrix.rust }} doc --locked --no-deps --features
          blocking,testing
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - "3.1"
          - "4.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
        working-directory: ruby
      - run: bundle exec ruby -W -Ilib -e 'Dir["test/*_test.rb"].sort.each { |file|
          require_relative file }'
        working-directory: ruby
      - run: bundle exec rubocop
        if: matrix.ruby == '4.0'
        working-directory: ruby
      - run: >
          gem build calmlens.gemspec -o calmlens.gem && gem install
          ./calmlens.gem && ruby -rcalmlens -e
          'CalmLens::ServerClient.new(api_key: "test", project_id:
          "test").close'
        working-directory: ruby
