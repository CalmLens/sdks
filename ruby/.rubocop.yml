AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    # Generated by packages/sdk-contract/generate.ts, mockClassification.ts and mockAssetFilters.ts.
    - 'lib/calmlens/error_codes.rb'
    - 'lib/calmlens/option_keys.rb'
    - 'lib/calmlens/transform_schema.rb'
    - 'lib/calmlens/upload_mime_types.rb'
    - 'lib/calmlens/testing/classification.rb'
    - 'lib/calmlens/testing/asset_filters.rb'
    # Generated by script/generate_models.rb.
    - 'lib/calmlens/models.rb'

Layout/LineLength:
  Max: 140

# Resource methods mirror the API's validation rules in one place; splitting them hides the order.
Metrics/AbcSize:
  Max: 60
  Exclude:
    - 'test/**/*'
Metrics/CyclomaticComplexity:
  Max: 20
Metrics/PerceivedComplexity:
  Max: 20
Metrics/MethodLength:
  Max: 30
Metrics/ClassLength:
  Max: 350
  Exclude:
    # The fake API answers every endpoint from one class, like the server's router.
    - 'lib/calmlens/testing/fake_api.rb'
Metrics/ParameterLists:
  Max: 10
  CountKeywordArgs: false
Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

# Tests read best as one scenario per method.
Style/Documentation:
  Exclude:
    - 'test/**/*'

# Request structs name their HTTP method `method`, like Net::HTTP and Rack.
Lint/StructNewOverride:
  Exclude:
    - 'lib/calmlens/transport.rb'
    - 'lib/calmlens/testing.rb'
Naming/AccessorMethodName:
  Exclude:
    - 'lib/calmlens/cdn.rb'
